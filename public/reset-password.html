<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FundLog — Nueva contraseña</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Sora', sans-serif; background: #F4F6FA; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.box { background: #fff; border-radius: 16px; padding: 48px 40px; width: 100%; max-width: 420px; box-shadow: 0 8px 40px rgba(0,0,0,0.08); }
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; justify-content: center; }
.logo-icon { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #152C4A, #378ADD); display: flex; align-items: center; justify-content: center; }
.logo-text { font-size: 20px; font-weight: 800; }
.logo-text .fund { color: #0C1A2E; }
.logo-text .log  { color: #378ADD; }
h2 { font-size: 22px; font-weight: 800; color: #0C1A2E; margin-bottom: 8px; text-align: center; }
.sub { font-size: 14px; color: #6B7A99; text-align: center; margin-bottom: 28px; }
.form-label { display: block; font-size: 11px; font-weight: 700; color: #6B7A99; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 7px; }
.form-input { width: 100%; padding: 12px 14px; border: 1.5px solid #DDE3EF; border-radius: 10px; font-family: 'Sora', sans-serif; font-size: 14px; color: #0C1A2E; outline: none; transition: all 0.2s; margin-bottom: 16px; }
.form-input:focus { border-color: #378ADD; box-shadow: 0 0 0 3px rgba(55,138,221,0.12); }
.btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #152C4A, #2B72C8); color: #fff; border: none; border-radius: 10px; font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 14px rgba(55,138,221,0.35); margin-top: 4px; }
.btn:hover { box-shadow: 0 8px 24px rgba(55,138,221,0.45); transform: translateY(-1px); }
.btn:disabled { opacity: 0.6; cursor: wait; transform: none; }
.msg { padding: 12px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; margin-bottom: 16px; display: none; }
.msg.error { background: #FCEBEB; color: #A32D2D; border: 1px solid #F0C0C0; }
.msg.success { background: #E1F5EE; color: #0F6E56; border: 1px solid #B3DFCF; }
.back { text-align: center; margin-top: 20px; font-size: 13px; color: #6B7A99; }
.back a { color: #378ADD; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="logo-icon">
      <svg width="22" height="22" viewBox="0 0 38 38" fill="none">
        <path d="M6 28 L12 21 L19 24.5 L29 12" stroke="rgba(255,255,255,0.9)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="29" cy="12" r="4" fill="white"/>
      </svg>
    </div>
    <div class="logo-text"><span class="fund">Fund</span><span class="log">Log</span></div>
  </div>

  <!-- PASO 1: pedir email -->
  <div id="stepEmail">
    <h2>¿Olvidaste tu contraseña?</h2>
    <p class="sub">Escribe tu email y te enviaremos un enlace para recuperarla.</p>
    <div class="msg" id="emailMsg"></div>
    <label class="form-label">Email</label>
    <input class="form-input" id="forgotEmail" type="email" placeholder="tu@email.com" autocomplete="email">
    <button class="btn" id="btnForgot">Enviar enlace de recuperación</button>
    <div class="back"><a href="/login">← Volver al login</a></div>
  </div>

  <!-- PASO 2: nueva contraseña (cuando hay token en URL) -->
  <div id="stepReset" style="display:none;">
    <h2>Nueva contraseña</h2>
    <p class="sub">Elige una contraseña segura para tu cuenta.</p>
    <div class="msg" id="resetMsg"></div>
    <label class="form-label">Nueva contraseña</label>
    <input class="form-input" id="newPassword" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
    <label class="form-label">Repite la contraseña</label>
    <input class="form-input" id="confirmPassword" type="password" placeholder="Repite la contraseña" autocomplete="new-password">
    <button class="btn" id="btnReset">Cambiar contraseña</button>
    <div class="back"><a href="/login">← Volver al login</a></div>
  </div>
</div>

<script>
const token = new URLSearchParams(window.location.search).get('token');

// Si hay token en URL → mostrar formulario de nueva contraseña
if (token) {
  document.getElementById('stepEmail').style.display = 'none';
  document.getElementById('stepReset').style.display = 'block';
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = `msg ${type}`;
  el.style.display = 'block';
}

// Solicitar email
document.getElementById('btnForgot').addEventListener('click', async () => {
  const email = document.getElementById('forgotEmail').value.trim();
  if (!email) { showMsg('emailMsg', 'Introduce tu email', 'error'); return; }

  const btn = document.getElementById('btnForgot');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  try {
    await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    showMsg('emailMsg', '✅ Si existe una cuenta con ese email, recibirás el enlace en unos segundos.', 'success');
    btn.textContent = 'Enviado ✓';
  } catch(e) {
    showMsg('emailMsg', 'Error al enviar. Inténtalo de nuevo.', 'error');
    btn.disabled = false;
    btn.textContent = 'Enviar enlace de recuperación';
  }
});

// Nueva contraseña
document.getElementById('btnReset').addEventListener('click', async () => {
  const pass1 = document.getElementById('newPassword').value;
  const pass2 = document.getElementById('confirmPassword').value;
  if (pass1.length < 6) { showMsg('resetMsg', 'Mínimo 6 caracteres', 'error'); return; }
  if (pass1 !== pass2)   { showMsg('resetMsg', 'Las contraseñas no coinciden', 'error'); return; }

  const btn = document.getElementById('btnReset');
  btn.disabled = true;
  btn.textContent = 'Cambiando...';

  try {
    const res  = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: pass1 })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    showMsg('resetMsg', '✅ Contraseña cambiada. Redirigiendo al login...', 'success');
    setTimeout(() => window.location.href = '/login', 2000);
  } catch(e) {
    showMsg('resetMsg', e.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Cambiar contraseña';
  }
});

// Enter para submit
document.getElementById('forgotEmail')?.addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('btnForgot').click(); });
document.getElementById('confirmPassword')?.addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('btnReset').click(); });
</script>
</body>
</html>
