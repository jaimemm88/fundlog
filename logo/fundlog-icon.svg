<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" rx="48" fill="url(#grad)"/>
  <rect width="200" height="200" rx="48" fill="url(#sheen)" opacity="0.35"/>

  <!-- Línea de tendencia alcista -->
  <path d="M36 152 L68 116 L103 134 L156 63"
        stroke="rgba(255,255,255,0.88)" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Halo del punto peak -->
  <circle cx="156" cy="63" r="26" fill="rgba(255,255,255,0.12)"/>
  <!-- Punto exterior -->
  <circle cx="156" cy="63" r="17" fill="white"/>
  <!-- Punto interior (azul) -->
  <circle cx="156" cy="63" r="9" fill="#378ADD"/>

  <!-- Barra base -->
  <rect x="36" y="166" width="128" height="7" rx="3.5" fill="rgba(255,255,255,0.2)"/>

  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#152C4A"/>
      <stop offset="1" stop-color="#2B72C8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
